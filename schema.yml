openapi: 3.0.3
info:
  title: VoyaVisa API
  version: 1.0.0
  description: VoyaVisa Visa and Travel Services API
paths:
  /api/v1/appointments/:
    get:
      operationId: v1_appointments_list
      description: فهرست رزروهای کاربر جاری.
      tags:
      - v1
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
    post:
      operationId: v1_appointments_create
      description: مالک درخواست یک زمان آزاد را رزرو می‌کند.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
        required: true
      security:
      - CookieJWT: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
        '404':
          description: رزرو یا فایل قابل دسترسی نیست.
        '400':
          description: ورودی، وضعیت رزرو یا زمان انتخاب‌شده معتبر نیست.
  /api/v1/appointments/{id}/:
    get:
      operationId: v1_appointments_retrieve
      description: جزئیات برای مالک رزرو.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
        '404':
          description: رزرو یا فایل قابل دسترسی نیست.
  /api/v1/appointments/{id}/cancel/:
    post:
      operationId: v1_appointments_cancel_create
      description: لغو رزرو توسط مالک، مطابق قواعد لغو پروژه.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
        '404':
          description: رزرو یا فایل قابل دسترسی نیست.
        '400':
          description: ورودی، وضعیت رزرو یا زمان انتخاب‌شده معتبر نیست.
  /api/v1/appointments/{id}/payment-receipt/:
    post:
      operationId: v1_appointments_payment_receipt_create
      description: ارسال یا جایگزینی رسید توسط مالک. فرمت JPEG، PNG یا PDF تا ۵ مگابایت.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - payment_receipt
              properties:
                payment_receipt:
                  type: string
                  format: binary
            encoding:
              payment_receipt:
                contentType: image/jpeg, image/png, application/pdf
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
        '404':
          description: رزرو یا فایل قابل دسترسی نیست.
        '400':
          description: ورودی، وضعیت رزرو یا زمان انتخاب‌شده معتبر نیست.
        '415':
          description: نوع بدنه پشتیبانی نمی‌شود.
  /api/v1/appointments/{id}/payment-receipt/download/:
    get:
      operationId: v1_appointments_payment_receipt_download_retrieve
      description: دانلود فایل خصوصی توسط مالک، مشاور رزرو یا بررسی‌کننده مجاز.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
        '404':
          description: رزرو یا فایل قابل دسترسی نیست.
  /api/v1/appointments/admin/payments/:
    get:
      operationId: v1_appointments_admin_payments_list
      description: صف رسیدهای در انتظار بررسی برای مدیر یا دارنده مجوز بررسی پرداخت.
      parameters:
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
      - v1
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentReviewList'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
          description: مجوز لازم وجود ندارد یا CSRF معتبر نیست.
        '404':
          description: رزرو یا فایل قابل دسترسی نیست.
  /api/v1/appointments/admin/payments/{id}/:
