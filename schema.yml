          description: No response body
  /api/v1/appointments/consultant/:
    get:
      operationId: v1_appointments_consultant_list
      description: فهرست رزروهای مشاور جاری.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: تاریخ جلسه به وقت تهران
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - pending
          - awaiting_payment
          - payment_submitted
          - payment_rejected
          - rejected
          - confirmed
          - cancelled
          - completed
          type: string
          minLength: 1
        description: |-
          * `pending` - در انتظار تأیید مشاور
          * `awaiting_payment` - در انتظار پرداخت
          * `payment_submitted` - در انتظار بررسی رسید
          * `payment_rejected` - پرداخت رد شده
          * `rejected` - درخواست رد شده
          * `confirmed` - رزرو قطعی
          * `cancelled` - لغو شده
          * `completed` - انجام شده
      tags:
      - v1
      security:
      - CookieJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentReviewList'
          description: ''
        '401':
          description: احراز هویت الزامی است.
        '403':
