  /api/v1/consultants/:
    get:
      operationId: v1_consultants_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: کدام فیلد باید هنگام مرتب‌سازی نتایج استفاده شود.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: یک عبارت جستجو.
        schema:
          type: string
      - in: query
        name: specialties__slug
        schema:
          type: string
      tags:
