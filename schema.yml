  /api/v1/appointments/admin/payments/{id}/reject/:
    post:
      operationId: v1_appointments_admin_payments_reject_create
      description: رد رسید توسط بررسی‌کننده مجاز و آزاد شدن زمان. بارگذاری مجدد در
