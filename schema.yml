components:
  schemas:
    ApplicationDetail:
      type: object
      properties:
        tracking_code:
          type: string
          readOnly: true
          title: کد پیگیری
        country_name:
          type: string
          readOnly: true
        visa_type:
          type: string
          title: نوع ویزا
          maxLength: 100
        travel_date:
          type: string
          format: date
          title: تاریخ سفر
        return_date:
          type: string
          format: date
          nullable: true
          title: تاریخ بازگشت
        purpose:
          type: string
          title: هدف سفر
        additional_notes:
          type: string
          title: توضیحات تکمیلی
        status:
          allOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          title: وضعیت درخواست
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        consultant:
          type: string
          readOnly: true
      required:
      - consultant
      - country_name
      - created_at
      - purpose
      - status_display
      - tracking_code
      - travel_date
      - updated_at
      - visa_type
    ApplicationHistory:
      type: object
      properties:
        previous_status:
          title: وضعیت قبلی
          oneOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
        previous_status_display:
          type: string
          readOnly: true
        new_status:
          allOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          title: وضعیت جدید
        new_status_display:
          type: string
          readOnly: true
        note:
          type: string
          title: توضیحات تغییر
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: زمان تغییر
      required:
      - created_at
      - new_status
      - new_status_display
      - previous_status_display
    ApplicationList:
      type: object
      properties:
        tracking_code:
          type: string
          readOnly: true
          title: کد پیگیری
        country_name:
          type: string
          readOnly: true
        visa_type:
          type: string
          title: نوع ویزا
          maxLength: 100
        travel_date:
          type: string
          format: date
          title: تاریخ سفر
        return_date:
          type: string
          format: date
          nullable: true
          title: تاریخ بازگشت
        status:
          allOf:
          - $ref: '#/components/schemas/NewStatusEnum'
          title: وضعیت درخواست
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - country_name
      - created_at
      - status_display
      - tracking_code
      - travel_date
      - updated_at
      - visa_type
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        availability:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status328Enum'
          readOnly: true
          default: pending
        user_note:
          type: string
          readOnly: true
        consultation_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        payment_card:
          type: string
          nullable: true
          readOnly: true
        payment_receipt_url:
          type: string
          format: uri
          nullable: true
          readOnly: true
        payment_note:
          type: string
          readOnly: true
        payment_submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        payment_reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        consultant_approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - availability
