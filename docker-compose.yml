services:
  db:
    image: postgres:16-alpine
    container_name: voyavisa-db
    restart: unless-stopped
    environment: &postgres_credentials
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voyavisa-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *postgres_credentials
      DJANGO_USE_SQLITE: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - private_media_data:/app/private_media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import Request, urlopen;
          from config.settings import ALLOWED_HOSTS;
          headers = {"Host": ALLOWED_HOSTS[0], "X-Forwarded-Proto": "https"};
          urlopen(Request("http://127.0.0.1:8000/api/v1/health/", headers=headers), timeout=3).close()
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1/
    container_name: voyavisa-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:
  private_media_data:
