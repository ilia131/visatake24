x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *production-logging

  backend:
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=1
      - --threads=2
    logging: *production-logging

  frontend:
    image: voyavisa-frontend:production
    logging: *production-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/index.html"]
      interval: 15s
      timeout: 4s
      retries: 4
