# Install only after Certbot issues the shared certificate for all four names.
server {
    listen 80;
    server_name visatake.ir api.visatake.ir admin.visatake.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/voyavisa-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name www.visatake.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/voyavisa-acme;
    }
    location / {
        return 301 https://visatake.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.visatake.ir;
    ssl_certificate /etc/letsencrypt/live/visatake.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visatake.ir/privkey.pem;

    return 301 https://visatake.ir$request_uri;
}

server {
    listen 443 ssl;
    server_name visatake.ir;
    ssl_certificate /etc/letsencrypt/live/visatake.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visatake.ir/privkey.pem;

    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

server {
    listen 443 ssl;
    server_name api.visatake.ir;
    ssl_certificate /etc/letsencrypt/live/visatake.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visatake.ir/privkey.pem;

    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    server_name admin.visatake.ir;
    ssl_certificate /etc/letsencrypt/live/visatake.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visatake.ir/privkey.pem;

    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;

    location = / {
        return 302 /admin/payments;
    }
    location ~ ^/admin/(?!payments(?:/|$)) {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
